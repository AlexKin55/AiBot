[platformio]
# Корень исходников — весь проект. Какое именно содержимое собирается,
# задаётся per-env через build_src_filter.
src_dir = .

# Общие настройки для всех окружений.
[common]
platform = espressif32
board = m5stack-cores3
framework = arduino

upload_port = /dev/ttyACM0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    links2004/WebSockets@^2.4.1
    m5stack/M5Unified@^0.2.9
    https://github.com/m5stack/StackChan-BSP.git
    https://github.com/stack-chan/m5stack-avatar.git

build_flags =
    -std=gnu++17
    -Iinclude
    -Isrc
    -DUART_SCLK_DEFAULT=UART_SCLK_XTAL
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=32768

build_unflags =
    -std=gnu++11

# ---------------------------------------------------------------------------
# Прошивка робота: главный цикл (setup/loop) в src/aibot/main.cpp + все модули.
# ---------------------------------------------------------------------------
[env:m5stack-cores3]
extends = common
# Все файлы приложения из src/aibot (main.cpp, state_machine, commands) + модули.
build_src_filter = +<src/aibot/*> +<src/wifi/wifi.cpp> +<src/websocket/websocket.cpp> +<src/move/move.cpp> +<src/protocol/protocol.cpp> +<src/screen/screen.cpp> +<src/sound/sound.cpp> +<src/microfon/microfon.cpp> +<src/camera/camera.cpp> +<src/leds/leds.cpp>

# ---------------------------------------------------------------------------
# Тестовая прошивка: точка входа в tests/tests.cpp, сценарии — tests/*.cpp.
# ---------------------------------------------------------------------------
[env:m5stack-cores3-tests]
extends = common
build_src_filter = +<tests/*> +<src/wifi/wifi.cpp> +<src/websocket/websocket.cpp> +<src/move/move.cpp> +<src/protocol/protocol.cpp> +<src/screen/screen.cpp> +<src/sound/sound.cpp> +<src/microfon/microfon.cpp> +<src/camera/camera.cpp> +<src/leds/leds.cpp>